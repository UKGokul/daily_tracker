<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container-large {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .graphs-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }
        .chart-widget {
            padding: 24px;
        }
        .stats-summary {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 200px;
            text-align: center;
            padding: 24px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app-background"></div>
    <div class="app-container">
        <header class="header glass-panel">
            <div class="header-left">
                <button id="backBtn" class="btn-secondary" style="margin-right: 16px;">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <div class="logo">
                    <i class="fas fa-chart-area logo-icon" style="color: var(--icon-blue)"></i>
                    <h1 class="app-title">History & Trends</h1>
                </div>
            </div>
            
            <div class="header-right">
                <div class="current-date-display">
                    <span class="date-day">Lifetime Data</span>
                </div>
            </div>
        </header>

        <main>
            <!-- Summary Stats -->
            <div class="stats-summary">
                <div class="glass-panel stat-card">
                    <div class="stat-value" id="totalDaysStat">0</div>
                    <div class="stat-label">Days Tracked</div>
                </div>
                <div class="glass-panel stat-card">
                    <div class="stat-value text-success" id="totalWorkoutsStat">0</div>
                    <div class="stat-label">Total Workouts</div>
                </div>
                <div class="glass-panel stat-card">
                    <div class="stat-value" style="color: var(--icon-green)" id="totalJointsStat">0</div>
                    <div class="stat-label">Joints Smoked</div>
                </div>
                <div class="glass-panel stat-card">
                    <div class="stat-value" style="color: var(--icon-blue)" id="totalWorkHoursStat">0h</div>
                    <div class="stat-label">Hours Worked</div>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="graphs-grid">
                
                <!-- Joints Chart -->
                <div class="glass-panel chart-widget medium-widget">
                    <div class="widget-header">
                        <h2><i class="fas fa-smoking icon-green"></i> Joints over Time</h2>
                    </div>
                    <div class="chart-container-large">
                        <canvas id="jointsChart"></canvas>
                    </div>
                </div>

                <!-- Workouts Chart -->
                <div class="glass-panel chart-widget medium-widget">
                    <div class="widget-header">
                        <h2><i class="fas fa-dumbbell icon-red"></i> Workouts Completed</h2>
                    </div>
                    <div class="chart-container-large">
                        <canvas id="workoutsChart"></canvas>
                    </div>
                </div>

                <!-- Task Completion -->
                <div class="glass-panel chart-widget large-widget">
                    <div class="widget-header">
                        <h2><i class="fas fa-check-square icon-teal"></i> Task Completion Rate</h2>
                    </div>
                    <div class="chart-container-large">
                        <canvas id="tasksChart"></canvas>
                    </div>
                </div>

                <!-- Budget Chart -->
                <div class="glass-panel chart-widget large-widget">
                    <div class="widget-header">
                        <h2><i class="fas fa-wallet icon-gold"></i> Budget Tracker</h2>
                    </div>
                    <div class="chart-container-large">
                        <canvas id="budgetChart"></canvas>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="history.js"></script>
</body>
</html>
