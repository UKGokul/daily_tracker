<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="DayLens — a privacy-first personal analytics dashboard. See what shapes your days." />
  <title>DayLens — See what shapes your days</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="src/styles.css" />
  <script src="config.js" defer onerror="this.remove()"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#today" aria-label="DayLens home">
        <span class="brand-mark" aria-hidden="true">◐</span>
        <span><strong>DayLens</strong><small>See what shapes your days.</small></span>
      </a>
      <nav class="nav-list" id="desktopNav">
        <button class="nav-item is-active" data-view="today"><span>⌂</span>Today</button>
        <button class="nav-item" data-view="calendar"><span>▦</span>Calendar</button>
        <button class="nav-item" data-view="insights"><span>⌁</span>Insights</button>
        <button class="nav-item" data-view="settings"><span>⚙</span>Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="privacy-pill"><span class="status-dot"></span><span>Local-first</span></div>
        <p>Your data stays on this device unless you enable cloud sync.</p>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="brand compact-brand" data-view="today" aria-label="DayLens home"><span class="brand-mark">◐</span><strong>DayLens</strong></button>
        <div class="date-nav" aria-label="Date navigation">
          <button class="icon-button" id="prevDay" aria-label="Previous day">‹</button>
          <button class="date-button" id="dateButton" aria-label="Jump to date"><span id="dateEyebrow">Today</span><strong id="dateLabel"></strong></button>
          <button class="icon-button" id="nextDay" aria-label="Next day">›</button>
          <button class="text-button" id="todayButton" hidden>Today</button>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="themeButton" aria-label="Change theme">◒</button>
          <button class="button button-primary" id="quickAddButton"><span>＋</span><span class="button-label">Quick add</span></button>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <section class="view is-active" data-view-panel="today" id="todayView"></section>
        <section class="view" data-view-panel="calendar" id="calendarView"></section>
        <section class="view" data-view-panel="insights" id="insightsView"></section>
        <section class="view" data-view-panel="settings" id="settingsView"></section>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="Primary navigation">
    <button class="is-active" data-view="today"><span>⌂</span><small>Today</small></button>
    <button data-view="calendar"><span>▦</span><small>Calendar</small></button>
    <button data-view="insights"><span>⌁</span><small>Insights</small></button>
    <button data-view="settings"><span>⚙</span><small>Settings</small></button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header"><div><span class="eyebrow" id="modalEyebrow">DayLens</span><h2 id="modalTitle">Add</h2></div><button class="icon-button" id="modalClose" aria-label="Close dialog">×</button></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <input type="file" id="importInput" accept="application/json" hidden />
  <input type="date" id="datePicker" hidden />

  <script type="module" src="src/main.js"></script>
</body>
</html>
